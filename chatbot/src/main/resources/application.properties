# 1. Conexao com o banco de dados Aiven (com a porta correta 20390 e banco defaultdb)
spring.datasource.url=jdbc:mysql://${DB_HOST}:20390/defaultdb?serverTimezone=UTC&sslMode=REQUIRED
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# 2. Configuracoes do Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 3. Configuracoes do Gemini (Puxando a chave com seguranca do Render)
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent