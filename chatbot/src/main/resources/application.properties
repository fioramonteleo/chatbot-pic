# 1. A URL com o comando mágico (createDatabaseIfNotExist) para criar o banco sozinho
spring.datasource.url=jdbc:mysql://localhost:3306/chatbot_db?createDatabaseIfNotExist=true&serverTimezone=UTC

# 2. As suas novas credenciais
spring.datasource.username=chatbot
spring.datasource.password=chatbot

# 3. Configurações do Hibernate (A regra agora é UPDATE)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configurações do Gemini
gemini.api.key=gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent